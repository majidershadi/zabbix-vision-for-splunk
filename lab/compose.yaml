services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a lab database password}
      POSTGRES_DB: zabbix
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U zabbix"]
      interval: 5s
      retries: 30
    mem_limit: 512m
  server:
    image: zabbix/zabbix-server-pgsql:alpine-${ZABBIX_VERSION:-7.4}-latest
    environment:
      DB_SERVER_HOST: db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a lab database password}
      POSTGRES_DB: zabbix
      ZBX_ENABLEGLOBALSCRIPTS: "1"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m
  web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-${ZABBIX_VERSION:-7.4}-latest
    environment:
      DB_SERVER_HOST: db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a lab database password}
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: server
      PHP_TZ: UTC
    ports:
      - "127.0.0.1:${WEB_PORT:-18074}:8080"
    depends_on:
      - server
    mem_limit: 512m
  agent:
    image: zabbix/zabbix-agent2:alpine-${ZABBIX_VERSION:-7.4}-latest
    environment:
      ZBX_HOSTNAME: Zabbix server
      ZBX_SERVER_HOST: server
    volumes:
      - ./agent-execution.conf:/etc/zabbix/zabbix_agent2.d/plugins.d/zabbix-vision.conf:ro
    mem_limit: 256m
volumes:
  db:
