# Install on the Splunk collector's Zabbix agent; adjust paths for your installation.
# Grant the agent read permission only to collector checkpoint files, not passwords.conf.
UserParameter=splunk.zabbix.collector.health,/usr/bin/python3 /opt/splunk/etc/apps/zabbix_vision/bin/zabbix_health.py --checkpoint-dir /opt/splunk/var/lib/splunk/modinputs/zabbix_vision --max-age 900

# Create a Zabbix text master item: splunk.zabbix.collector.health
# Dependent numeric items: $.ok, $.stale, $.errors, $.max_age_seconds
# Trigger if $.ok = 0, and a nodata trigger after 15 minutes.
# Retired input checkpoints must be archived or excluded from the health directory.
