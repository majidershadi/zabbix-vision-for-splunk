# Deploy only the stanzas appropriate to each host, after reviewing log access.
# Create the zabbix index first, and update the app's zabbix_index macro.
[monitor:///var/log/zabbix/zabbix_agentd.log]
disabled = 1
sourcetype = zabbix:agent
index = zabbix

[monitor:///var/log/zabbix/zabbix_agent2.log]
disabled = 1
sourcetype = zabbix:agent2
index = zabbix

[monitor:///var/log/zabbix/zabbix_server.log]
disabled = 1
sourcetype = zabbix:server
index = zabbix

[monitor:///var/log/nginx/zabbix_access.log]
disabled = 1
sourcetype = zabbix:web
index = zabbix

# Windows agent2 example:
#[monitor://C:\Program Files\Zabbix Agent 2\zabbix_agent2.log]
#disabled = 0
#sourcetype = zabbix:agent2
#index = zabbix

# Forward OS execution audit with your established Splunk Linux/Windows add-ons.
