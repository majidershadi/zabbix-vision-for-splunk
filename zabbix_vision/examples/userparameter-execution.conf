# Linux only. Deploy/review the wrapper and JSON configuration before enabling.
# Fixed commands and simple keys only; flexible UserParameter arguments unsupported.
# Wrapper timeout must be shorter than the effective Zabbix item/agent timeout.
UserParameter=vision.health,/usr/bin/python3 /etc/zabbix/scripts/userparameter-wrapper.py --config /etc/zabbix/userparameter-execution.json --key vision.health

# Separately create a Zabbix agent (active) item with information type Log:
# logrt["/var/log/zabbix/^userparameter-execution\.jsonl(\.[0-9]+)?$"]
# Configure ServerActive/Hostname normally and preserve every record (no discard
# unchanged/throttling or preprocessing that drops start/end records).
# Collect this LOG ITEM's numeric item ID using the Splunk userparameters stream,
# not the numeric-result vision.health item's ID.
