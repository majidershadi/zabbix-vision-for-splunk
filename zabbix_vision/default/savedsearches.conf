[Zabbix - Failed login burst]
search = `zabbix_events` sourcetype=zabbix:audit action=failed_login | dedup event_uid | stats count values(user) AS users by instance src | where count>=5
description = Five or more distinct failed-login audit records from a source in 15 minutes.
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0

[Zabbix - Collection errors or delayed heartbeats]
search = `zabbix_events` sourcetype=zabbix:collector | stats latest(status) AS status max(_time) AS last_seen latest(lag_seconds) AS lag_seconds by instance input_name stream | where status="error" OR now()-last_seen>900 OR lag_seconds>1800
description = Configure thresholds for your polling cadence. Streams never seen or absent longer than the search range require external agent monitoring.
dispatch.earliest_time = -7d
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0

[Zabbix - Sensitive configuration changes]
search = `zabbix_events` sourcetype=zabbix:audit category=change (resource=authentication OR resource=api_token OR resource=role OR resource=user_directory OR resource=mfa OR resource=script) | dedup event_uid | table _time instance user src action resource resource_name
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
