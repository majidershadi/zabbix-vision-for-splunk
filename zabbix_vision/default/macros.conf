[zabbix_index]
definition = index=main
iseval = 0

[zabbix_events]
definition = `zabbix_index` sourcetype=zabbix:*
iseval = 0

[zabbix_userparameter_correlation]
definition = dedup event_uid | stats min(_time) AS first_seen max(_time) AS last_seen values(dest) AS dest values(userparameter_key) AS userparameter_key values(command_id) AS command_id count(eval(phase="start")) AS start_records count(eval(phase="end")) AS end_records values(eval(if(phase="end",status,null()))) AS reported_status values(eval(if(phase="end",exit_code,null()))) AS exit_code max(duration_ms) AS duration_ms by instance hostid itemid invocation_id | eval evidence_state=case(mvcount(reported_status)>1 OR mvcount(userparameter_key)>1 OR mvcount(command_id)>1 OR mvcount(exit_code)>1,"conflicting_records",end_records=0,"start_only",start_records=0,"end_only",true(),"start_and_end") | eval age_seconds=now()-last_seen
iseval = 0
