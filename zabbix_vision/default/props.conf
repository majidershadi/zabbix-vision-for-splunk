[zabbix:agent]
SHOULD_LINEMERGE = false
TIME_PREFIX = ^\s*(?:\d+:)?
TIME_FORMAT = %Y%m%d:%H%M%S.%3N
MAX_TIMESTAMP_LOOKAHEAD = 24
REPORT-zabbix_agent_command = zabbix_agent_command
EVAL-dataset = "agent"
EVAL-vendor_product = "Zabbix"
EVAL-dest = host

[zabbix:agent2]
SHOULD_LINEMERGE = false
TIME_PREFIX = ^
TIME_FORMAT = %Y/%m/%d %H:%M:%S.%6N
MAX_TIMESTAMP_LOOKAHEAD = 30
REPORT-zabbix_agent_command = zabbix_agent_command
EVAL-dataset = "agent"
EVAL-vendor_product = "Zabbix"
EVAL-dest = host

